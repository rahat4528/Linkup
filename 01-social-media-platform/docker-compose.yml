version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: linkup_social_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: linkup_user
      POSTGRES_PASSWORD: linkup_secure_password
      POSTGRES_DB: linkup_social_media_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U linkup_user -d linkup_social_media_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: linkup_social_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:RELEASE.2024-01-16T16-07-38Z
    container_name: linkup_social_minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minio_admin
      MINIO_ROOT_PASSWORD: minio_password
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data

  recommendation-service:
    build:
      context: ./recommendation_service
      dockerfile: Dockerfile
    container_name: linkup_social_recommender
    restart: unless-stopped
    ports:
      - "8001:8001"
    environment:
      - PORT=8001

volumes:
  postgres_data:
  redis_data:
  minio_data:
