version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: linkup_instagram_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: linkup_user
      POSTGRES_PASSWORD: linkup_secure_password
      POSTGRES_DB: linkup_instagram_db
    ports:
      - "5433:5432"
    volumes:
      - instagram_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U linkup_user -d linkup_instagram_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: linkup_instagram_redis
    restart: unless-stopped
    ports:
      - "6380:6379"
    volumes:
      - instagram_redis_data:/data

  minio:
    image: minio/minio:RELEASE.2024-01-16T16-07-38Z
    container_name: linkup_instagram_minio
    restart: unless-stopped
    command: server /data --console-address ":9003"
    environment:
      MINIO_ROOT_USER: minio_admin
      MINIO_ROOT_PASSWORD: minio_password
    ports:
      - "9002:9000"
      - "9003:9001"
    volumes:
      - instagram_minio_data:/data

volumes:
  instagram_postgres_data:
  instagram_redis_data:
  instagram_minio_data:
