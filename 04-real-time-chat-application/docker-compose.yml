version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: linkup_chat_postgres
    restart: always
    environment:
      POSTGRES_USER: linkup_admin
      POSTGRES_PASSWORD: linkup_password
      POSTGRES_DB: linkup_chat_db
    ports:
      - "5435:5432"
    volumes:
      - chat_postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: linkup_chat_redis
    restart: always
    ports:
      - "6382:6379"
    volumes:
      - chat_redis_data:/data

volumes:
  chat_postgres_data:
  chat_redis_data:
